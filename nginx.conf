server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;

  # Relative Location-Header, damit Weiterleitungen hinter dem TLS-Proxy
  # nicht auf http:// zeigen.
  absolute_redirect off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/html text/css application/javascript image/svg+xml font/woff2;

  include /etc/nginx/snippets/security-headers.conf;

  error_page 404 /404.html;

  location ~* ^/(vendor/|assets/fonts/).+\.(css|js|svg|woff2)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  location ~* \.woff2$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  # Startseite: liefert index.html direkt aus (try_files ohne interne
  # Weiterleitung), daher keine Schleife mit der 301 von /index.html.
  location = / {
    expires -1;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/security-headers.conf;
    try_files /index.html =404;
  }

  location = /index.html {
    return 301 /;
  }

  location = /impressum.html {
    return 301 https://wissen-und-werkzeug.de/impressum/;
  }

  location = /datenschutz.html {
    expires -1;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/security-headers.conf;
  }

  location = /404.html {
    internal;
    expires -1;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/security-headers.conf;
  }

  # Nur vorhandene Dateien, alles andere 404.
  location / {
    try_files $uri =404;
  }
}
